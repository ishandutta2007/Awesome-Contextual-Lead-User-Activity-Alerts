<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#080e1a" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.75)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.6)" />
    </linearGradient>

    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-12px) scale(1.02); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.08); }
      }
      @keyframes signalFlow {
        0% { stroke-dashoffset: 240; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes radarPing {
        0% { r: 10px; opacity: 0.9; }
        100% { r: 42px; opacity: 0; }
      }
      @keyframes badgeBob1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes badgeBob2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(6px); }
      }

      .floating-orb1 { animation: floatSlow 8s ease-in-out infinite; transform-origin: center; }
      .floating-orb2 { animation: floatSlow 10s ease-in-out infinite 2s; transform-origin: center; }
      .pulsing-glow { animation: pulseGlow 6s ease-in-out infinite; transform-origin: center; }
      .signal-line { stroke-dasharray: 12, 12; animation: signalFlow 5s linear infinite; }
      .radar-ring { animation: radarPing 2.5s cubic-bezier(0.2, 0.8, 0.2, 1) infinite; }
      .radar-ring-delayed { animation: radarPing 2.5s cubic-bezier(0.2, 0.8, 0.2, 1) infinite 1.25s; }
      .pill-1 { animation: badgeBob1 5s ease-in-out infinite; }
      .pill-2 { animation: badgeBob2 5s ease-in-out infinite 1s; }
      .pill-3 { animation: badgeBob1 6s ease-in-out infinite 2s; }
      .pill-4 { animation: badgeBob2 6s ease-in-out infinite 0.5s; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Animated Glowing Background Orbs (Behind All Content) -->
  <g class="pulsing-glow">
    <circle cx="200" cy="120" r="140" fill="url(#glowCyan)" filter="url(#blurFilter)" />
    <circle cx="1020" cy="300" r="160" fill="url(#glowViolet)" filter="url(#blurFilter)" />
  </g>

  <!-- Technical Grid Background -->
  <g stroke="#334155" stroke-opacity="0.15" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="420" />
    <line x1="200" y1="0" x2="200" y2="420" />
    <line x1="320" y1="0" x2="320" y2="420" />
    <line x1="440" y1="0" x2="440" y2="420" />
    <line x1="560" y1="0" x2="560" y2="420" />
    <line x1="680" y1="0" x2="680" y2="420" />
    <line x1="800" y1="0" x2="800" y2="420" />
    <line x1="920" y1="0" x2="920" y2="420" />
    <line x1="1040" y1="0" x2="1040" y2="420" />
    
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
  </g>

  <!-- Background Dynamic Flow Lines -->
  <g opacity="0.35">
    <path class="signal-line" d="M 60 360 C 260 360, 320 380, 500 380 S 800 360, 1140 360" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="signal-line" d="M 100 60 C 300 60, 450 40, 650 40 S 950 60, 1100 60" fill="none" stroke="#a855f7" stroke-width="2" />
  </g>

  <!-- Foreground Main Title and Headers (Always On Top) -->
  <g class="font-sans" text-anchor="middle">
    <!-- Top Category Tag -->
    <rect x="450" y="38" width="300" height="30" rx="15" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="470" cy="53" r="5" fill="#38bdf8" />
    <circle class="radar-ring" cx="470" cy="53" r="5" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <circle class="radar-ring-delayed" cx="470" cy="53" r="5" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <text x="605" y="58" fill="#e2e8f0" font-size="12" font-weight="600" letter-spacing="1.5">B2B BUYER INTENT &amp; VISITOR RADAR</text>

    <!-- Main Title -->
    <text x="600" y="145" fill="url(#accentGrad)" font-size="44" font-weight="800" letter-spacing="-0.5" filter="url(#softGlow)">
      Awesome Contextual Lead Alerts
    </text>

    <!-- Subtitle / Tagline -->
    <text x="600" y="195" fill="#f8fafc" font-size="20" font-weight="500" letter-spacing="0.2">
      Website Visitor Deanonymization • Buying Intent Detection • Real-Time Sales Signals
    </text>

    <text x="600" y="228" fill="#94a3b8" font-size="14" font-weight="400">
      Curated ecosystem of SaaS leaders &amp; self-hosted open-source intelligence pipelines
    </text>
  </g>

  <!-- Dynamic Feature Badges / Floating Cards in Foreground Lower Deck -->
  <g class="font-sans">
    <!-- Pill 1: Visitor De-Anonymization -->
    <g class="pill-1" transform="translate(90, 275)">
      <rect width="230" height="80" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.5" />
      <circle cx="35" cy="40" r="18" fill="#0369a1" fill-opacity="0.4" />
      <text x="35" y="46" fill="#38bdf8" font-size="18" text-anchor="middle">🔍</text>
      <text x="68" y="36" fill="#f1f5f9" font-size="14" font-weight="700">Reverse-IP Match</text>
      <text x="68" y="56" fill="#94a3b8" font-size="11" font-weight="400">Deanonymize visiting orgs</text>
    </g>

    <!-- Pill 2: Intent Scoring Engine -->
    <g class="pill-2" transform="translate(350, 275)">
      <rect width="230" height="80" rx="12" fill="url(#cardGrad)" stroke="#818cf8" stroke-opacity="0.35" stroke-width="1.5" />
      <circle cx="35" cy="40" r="18" fill="#4338ca" fill-opacity="0.4" />
      <text x="35" y="46" fill="#818cf8" font-size="18" text-anchor="middle">⚡</text>
      <text x="68" y="36" fill="#f1f5f9" font-size="14" font-weight="700">Intent Scoring</text>
      <text x="68" y="56" fill="#94a3b8" font-size="11" font-weight="400">Track high-intent behaviors</text>
    </g>

    <!-- Pill 3: Instant Dispatch -->
    <g class="pill-3" transform="translate(610, 275)">
      <rect width="230" height="80" rx="12" fill="url(#cardGrad)" stroke="#c084fc" stroke-opacity="0.35" stroke-width="1.5" />
      <circle cx="35" cy="40" r="18" fill="#7e22ce" fill-opacity="0.4" />
      <text x="35" y="46" fill="#c084fc" font-size="18" text-anchor="middle">🔔</text>
      <text x="68" y="36" fill="#f1f5f9" font-size="14" font-weight="700">Instant Alerts</text>
      <text x="68" y="56" fill="#94a3b8" font-size="11" font-weight="400">Slack, Teams &amp; Webhooks</text>
    </g>

    <!-- Pill 4: Open Source Sovereignty -->
    <g class="pill-4" transform="translate(870, 275)">
      <rect width="240" height="80" rx="12" fill="url(#cardGrad)" stroke="#34d399" stroke-opacity="0.35" stroke-width="1.5" />
      <circle cx="35" cy="40" r="18" fill="#047857" fill-opacity="0.4" />
      <text x="35" y="46" fill="#34d399" font-size="18" text-anchor="middle">🛡️</text>
      <text x="68" y="36" fill="#f1f5f9" font-size="14" font-weight="700">Data Sovereignty</text>
      <text x="68" y="56" fill="#94a3b8" font-size="11" font-weight="400">Self-hosted privacy stacks</text>
    </g>
  </g>
</svg>
